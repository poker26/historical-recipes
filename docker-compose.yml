services:
  # === Reverse Proxy ===
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === Application ===
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === Public landing site (botanik.fun) ===
  # Server-rendered marketing + public profiles. Fetches the INTERNAL backend on
  # the compose network (no public-API exposure / CORS needed). Bound to
  # 127.0.0.1 only — the HOST nginx terminates TLS for botanik.fun and proxies
  # to this port (see deploy/botanik.fun.nginx.conf).
  landing:
    build: ./landing
    environment:
      - LANDING_API_BASE=http://backend:8000/api
    ports:
      - "127.0.0.1:8127:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === botanik.fun v2: справочный сайт (docs/RFC-botanik-site.md) ===
  # Преемник `landing`: те же адреса шэров и арта плюс атлас, рецепты, библиотека,
  # справочники и места. Рендер на сервере с внутреннего backend. Хостовый nginx
  # botanik.fun смотрит сюда (deploy/botanik.fun.nginx.conf); `landing` остаётся
  # запущенным как мгновенный откат сменой порта в vhost.
  site:
    build: ./site
    environment:
      - LANDING_API_BASE=http://backend:8000/api
      - SITE_URL=https://botanik.fun
      # Ключ IndexNow и коды подтверждения Яндекс Вебмастера и Search Console из .env;
      # пустое значение выключает соответствующую функцию.
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - YANDEX_VERIFICATION=${YANDEX_VERIFICATION:-}
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
    volumes:
      # Кэш данных Next переживает пересборку контейнера: после выкладки страницы остаются
      # тёплыми. Сбросить кэш: docker compose stop site, docker volume rm <проект>_site-next-cache.
      - site-next-cache:/app/.next/cache
    ports:
      - "127.0.0.1:8131:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === Consumer agent site (nastoiki.pro) ===
  # Mobile-first selling page for the master-classes with the embedded «Мастер
  # настоек» chat agent. The browser calls /api/agent/chat SAME-ORIGIN, so the
  # HOST nginx vhost for nastoiki.pro proxies /api → the compose nginx (which
  # routes to backend) and / → this container. Bound to 127.0.0.1 only.
  nastoiki:
    build: ./nastoiki
    ports:
      - "127.0.0.1:8128:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # === Temporal worker ===
  # Runs the durable book-pipeline activities/workflows.  Reuses the backend
  # image (same code + deps) but its command is the worker entrypoint instead
  # of uvicorn.  No published ports: it only makes outbound gRPC calls to the
  # shared Temporal cluster on server 3.
  worker:
    build: ./backend
    env_file: .env
    command: python -m app.temporal.worker
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === klex.ru mirror worker ===
  # Dedicated, isolated worker for the KlexHerbDownloadWorkflow on its own task
  # queue ("klex-download"). Kept separate from the main `worker` so the long,
  # I/O-bound download sweep never shares a process with the CPU-heavy OCR/LLM
  # pipeline activities — otherwise that contention trips Temporal's deadlock
  # detector and stalls the download. Reuses the backend image.
  klex-worker:
    build: ./backend
    env_file: .env
    command: python -m app.temporal.klex_worker
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === MCP server (consumer-facing retrieval surface) ===
  # Reuses the backend image (same code + deps), like the worker, but runs the
  # MCP Streamable HTTP server instead of uvicorn/worker.  Tools are thin wrappers
  # over the backend REST API on the internal network — no SQL is duplicated.
  # No published ports: nginx reaches it at mcp:8200 and exposes the public /mcp.
  mcp:
    build: ./backend
    env_file: .env
    command: python -m app.mcp.server
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === Cleanup / quest / monograph worker (task queue "dispatcher") ===
  # Second Temporal worker, deliberately separate from `worker`: it hosts the
  # 24/7 BookDispatcherWorkflow pool plus the long-running singleton workflows
  # (PlantCleanup, FillLatin, BiotopeCanon, QuestSetBuilder, ReaderMonograph …).
  # Splitting them means a book-pipeline redeploy never interrupts a cleanup run
  # and vice versa. Small DB pool on purpose — these activities hold a session
  # across long LLM/iNat awaits, so a wide pool just starves the backend.
  dispatcher:
    build: ./backend
    env_file: .env
    command: python -m app.temporal.dispatcher_worker
    environment:
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=2
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === nastoiki.pro Telegram bot (@neprostoinastoi_bot) ===
  # Long-polling bot on the backend image: `/start book1858` records a lead and
  # sends the 1858 book PDF, any other text is proxied to our own
  # /api/agent/chat (the same «Мастер настоек» agent the site talks to).
  nastoiki-bot:
    build: ./backend
    env_file: .env
    command: python -m app.bot.telegram
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === nastoiki.pro Max bot (@se13474809_bot) ===
  # Same job as the Telegram bot over the Max (TamTam-style) Bot API: replies in
  # private dialogs only, plain text (no Markdown), gift + agent proxy.
  nastoiki-bot-max:
    build: ./backend
    env_file: .env
    command: python -m app.bot.max
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === Qtickets abandoned-order nudger ===
  # Polls the Qtickets REST API for unpaid master-class orders past a grace
  # period and reports each once to the owner in Telegram with the client's
  # contact and the ready «доплатить» payment_url. Reporting only — it never
  # mails the clients. Dedup via the `qtickets_nudges` table.
  nastoiki-nudge:
    build: ./backend
    env_file: .env
    command: python -m app.jobs.nudge
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === nastoiki.pro staging front (host nginx :8129, basic-auth) ===
  # Preview stand for WIP copy before it goes to the real nastoiki.pro.
  # PINNED TO THE ALREADY-BUILT IMAGE ON PURPOSE: the `nastoiki-staging/` source
  # tree and deploy/promote-nastoiki.sh are NO LONGER on this server, so there is
  # nothing to build from. Do NOT swap this for `build: ./nastoiki-staging`
  # before those sources are restored — compose would fail on a missing context.
  nastoiki-staging:
    image: historical-recipes-nastoiki-staging:latest
    ports:
      - "127.0.0.1:8130:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  site-next-cache:
