services:
  # === Reverse Proxy ===
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  # === Application ===
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # === Temporal worker ===
  # Runs the durable book-pipeline activities/workflows.  Reuses the backend
  # image (same code + deps) but its command is the worker entrypoint instead
  # of uvicorn.  No published ports: it only makes outbound gRPC calls to the
  # shared Temporal cluster on server 3.
  worker:
    build: ./backend
    env_file: .env
    command: python -m app.temporal.worker
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
