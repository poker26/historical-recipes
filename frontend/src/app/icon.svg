  <path d="M16 16 C19.5 12.5 23.5 12 26 14 C24.5 17 20 17.5 16 16 Z" fill="url(#leaf)"/>
  <!-- bottom pair -->
  <path d="M16 23 C12.5 20 8.5 19.5 6.5 21.5 C8 24.5 12 25 16 23 Z" fill="url(#leaf)"/>
  <path d="M16 23 C19.5 20 23.5 19.5 25.5 21.5 C24 24.5 20 25 16 23 Z" fill="url(#leaf)"/>
