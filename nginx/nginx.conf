# Адреса контейнеров спрашиваем у DNS Docker на лету (resolve, nginx >= 1.27.3).
# Без этого nginx запоминает IP при старте: 2 октября 2026 бэкенд пересоздали,
# он получил новый адрес, а nginx сутки слал запросы на старый, и приложение
# получало 502 на каждом определении. Заодно nginx стартует, даже если какой-то
# из контейнеров лежит (раньше упавший mcp не давал перечитать конфигурацию).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend {
    zone upstream_frontend 64k;
    server frontend:3000 resolve;
}

upstream backend {
    zone upstream_backend 64k;
    server backend:8000 resolve;
}

upstream mcp {
    zone upstream_mcp 64k;
    server mcp:8200 resolve;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    # Upload endpoint — stricter rate limit, larger body (must be before /api/)
    location /api/books/upload {
        limit_req zone=upload burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        client_max_body_size 1g;
        proxy_request_buffering off;   # stream big uploads straight to backend
    }

    # Backend API
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health check
    location /health {
        proxy_pass http://backend/health;
    }

    # MCP server (Streamable HTTP). Buffering OFF so SSE streaming responses flush
    # to the client immediately; long read timeout for held-open streams.
    location /mcp {
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Frontend — catch-all
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
