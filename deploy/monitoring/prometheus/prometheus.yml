global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

rule_files: ["/etc/prometheus/rules/*.yml"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  # Сами серверы: node_exporter слушает только приватный адрес.
  - job_name: node
    static_configs:
      - {targets: ["192.168.0.1:9100"], labels: {host: prod-app}}
      - {targets: ["192.168.0.2:9100"], labels: {host: prod-data}}
      - {targets: ["192.168.0.3:9100"], labels: {host: dev}}

  # Внутренние службы по приватной сети (изнутри Selectel).
  - job_name: blackbox_internal_http
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - http://192.168.0.1:8126/health          # бэкенд ботаники через её nginx
          - http://192.168.0.3:8100/health          # BGE-M3 (dev)
          - http://192.168.0.2:9000/minio/health/live
          - http://192.168.0.2:6333/healthz         # Qdrant
    relabel_configs: &bb
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}

  - job_name: blackbox_internal_tcp
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets:
          - 192.168.0.3:7233   # Temporal (dev)
          - supabase-pooler:6543   # пулер Supabase, транзакции (по имени: опубликованный на 192.168.0.2 порт из Docker-сети не виден)
          - supabase-pooler:5432   # пулер Supabase, сессии
    relabel_configs: *bb

# Внешние проверки сайтов присылает Пи (job="blackbox_external", source="pi")
# через remote_write — см. /opt/pi-probe на малинке.
