# HOST nginx vhost for nastoiki.pro — server 1 (46.173.19.68).
# Install: /etc/nginx/sites-available/nastoiki.pro → symlink into sites-enabled,
# then `certbot --nginx -d nastoiki.pro -d www.nastoiki.pro` to add the TLS block.
#
# Two upstreams, both loopback on server 1:
#   - the nastoiki container (docker-compose service `nastoiki`) on 127.0.0.1:8128
#     serves the site itself;
#   - /api/ is proxied to the HR compose nginx (:8126 by default; the stack's
#     NGINX_HTTP_PORT) which already routes /api → backend with its rate-limits.
#     This keeps the browser's fetch SAME-ORIGIN (no CORS) and reuses one API path.
#
# Adjust HR_NGINX_PORT below if the compose nginx is published on a different
# host port on this box.

# The agent chat is a long-held SSE stream — give it a generous read timeout and
# turn OFF proxy buffering so tokens flush to the browser as they arrive.
server {
    listen 80;
    listen [::]:80;
    server_name nastoiki.pro www.nastoiki.pro;

    # Agent chat (Server-Sent Events) — stream through untouched.
    location /api/agent/ {
        proxy_pass http://127.0.0.1:8126;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # Rest of the API (if the site ever needs it) → same compose nginx.
    location /api/ {
        proxy_pass http://127.0.0.1:8126;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The site itself.
    location / {
        proxy_pass http://127.0.0.1:8128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
