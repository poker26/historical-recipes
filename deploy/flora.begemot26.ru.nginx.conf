# HOST nginx vhost for flora.begemot26.ru — server 1 (46.173.19.68). Справочная копия
# установленного файла /etc/nginx/sites-enabled/flora.begemot26.ru (снята 25.09.2026,
# уже с TLS-блоками certbot). Правится НА СЕРВЕРЕ (sed/python по месту), сюда копируется
# после правки; не устанавливать поверх certbot-версии вслепую.
#
# Публичный домен без mTLS: /mcp, белый список read-API для приложения «Что растёт»
# и блок maintenance-deny, который закрывает служебные пишущие ручки корпуса под
# публичными префиксами (закрыто 25.09.2026 после проверки: до этого они проходили).
# flora.begemot26.ru — PUBLIC surface (NO mTLS).
# Exposes: /mcp (MCP retrieval) + the «Что растёт» field-app read API + landing.
# Admin UI, uploads and write/delete REST stay private (hist, mTLS) — NOT mapped here.
server {
    server_name flora.begemot26.ru;
    location = /privacy { alias /var/www/whatgrows/privacy.html; default_type text/html; }
    location = /begemot/privacy { alias /var/www/begemot/privacy.html; default_type text/html; }
    location = /bgmlog { access_log /var/log/nginx/begemot-diag.log; default_type text/plain; return 204; }
    location = /begemot/direct.json { alias /var/www/begemot/direct.json; default_type application/json; add_header Cache-Control "no-cache"; }

    # maintenance-deny: служебные ручки, которые меняют корпус (перелинковка, дедуп,
    # нормализация словарей, добор из iNat, пересчёт наборов, ингест мест). Живут под
    # публичными префиксами ниже, поэтому закрываем их ДО белого списка: nginx берёт
    # первую совпавшую regex-location. Админка ходит к ним через hist (mTLS).
    location ~ ^/api/(plants/(relink-recipes|dedupe-latin|enrich-inat(/run)?)|compounds/(normalize|dedup)|medical/(run|normalize|dedup|dedup-actions)|quests/set/compute|places/ingest)/?$ {
        return 404;
    }

    # «Что растёт» Android field client — ONLY the read endpoints it calls.
    # Whitelisted prefixes proxy to the container nginx on :8126 (which routes
    # /api/ -> backend, with its own rate limits). Anything else under /api/
    # (books/upload, wizard, delete…) is intentionally NOT matched here and
    # falls through to the 404 landing — admin stays off the public domain.
    location ~ ^/api/(analytics|walks|showcase|houseplants|plants|recipes|compounds|medical|identify|quests|places|devices)(/|$) {
        proxy_pass http://127.0.0.1:8126;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 12m;   # plant photo upload for /identify
    }

    # MCP Streamable HTTP -> container nginx on :8126 -> mcp:8200
    location /mcp {
        proxy_pass http://127.0.0.1:8126;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:3850;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/flora.begemot26.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/flora.begemot26.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = flora.begemot26.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name flora.begemot26.ru;
    location = /privacy { alias /var/www/whatgrows/privacy.html; default_type text/html; }
    return 404; # managed by Certbot
}
