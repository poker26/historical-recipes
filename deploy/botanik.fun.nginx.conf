# HOST nginx vhost for the «Что растёт» landing — server 1 (46.173.19.68).
# Install: /etc/nginx/sites-available/botanik.fun → symlink into sites-enabled,
# then `certbot --nginx -d botanik.fun` to add the TLS block + redirect.
#
# The landing container is published on 127.0.0.1:8127 by docker-compose
# (service `landing`). Deep-link association files are returned inline here so
# they always carry Content-Type: application/json (Next would serve the
# extension-less AASA as octet-stream, which iOS rejects).

server {
    listen 80;
    listen [::]:80;
    server_name botanik.fun;

    # Android App Links — fingerprints of the RuStore release cert (alias `plantid`)
    # AND the local debug cert (so sideloaded debug builds also verify).
    location = /.well-known/assetlinks.json {
        default_type application/json;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"ru.begemot.plantid","sha256_cert_fingerprints":["2C:09:9A:A9:4E:15:C8:63:A7:5C:29:32:33:EA:95:5A:60:72:42:F1:1A:B6:61:05:9A:7B:EB:7C:3E:99:8C:6A","D5:00:A2:E0:91:1F:3E:22:B6:FD:B8:80:75:23:35:61:25:6E:11:E8:2E:2F:F0:2E:F4:AF:23:0D:D3:53:60:AB"]}}]';
    }

    # iOS Universal Links — appID = TEAMID.bundleID.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        return 200 '{"applinks":{"apps":[],"details":[{"appID":"9J4X6PJX56.ru.begemot.whatgrows","paths":["/p/*","/quest/*","/plant/*","/invite/*"]}]}}';
    }

    location / {
        proxy_pass http://127.0.0.1:8127;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
