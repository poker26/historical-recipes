# HOST nginx vhost for botanik.fun — server 1 (46.173.19.68).
# Install: /etc/nginx/sites-available/botanik.fun → symlink into sites-enabled,
# then `certbot --nginx -d botanik.fun` to add the TLS block + redirect
# (on the server the certbot-managed `listen 443 ssl` lines live inside this block).
#
# Since 27.09.2026 the site is served by the compose service `site` (botanik.fun v2,
# the reference site: atlas, recipes, library, reference, places) on 127.0.0.1:8131.
# The old landing (`landing`, 127.0.0.1:8127) stays up: rolling back is switching the
# two proxy_pass ports below and `nginx -s reload`.
# Deep-link association files are returned inline here so they always carry
# Content-Type: application/json (Next would serve the extension-less AASA as
# octet-stream, which iOS rejects).

# Scan images are rendered by the backend on first request (PDF pages up to ~5 s):
# a per-IP limit keeps one visitor from paging through a whole book in a loop.
limit_req_zone $binary_remote_addr zone=botanik_scans:10m rate=4r/s;

server {
    listen 80;
    listen [::]:80;
    server_name botanik.fun;

    # Android App Links — fingerprints of the RuStore release cert (alias `plantid`)
    # AND the local debug cert (so sideloaded debug builds also verify).
    location = /.well-known/assetlinks.json {
        default_type application/json;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"ru.begemot.plantid","sha256_cert_fingerprints":["2C:09:9A:A9:4E:15:C8:63:A7:5C:29:32:33:EA:95:5A:60:72:42:F1:1A:B6:61:05:9A:7B:EB:7C:3E:99:8C:6A","D5:00:A2:E0:91:1F:3E:22:B6:FD:B8:80:75:23:35:61:25:6E:11:E8:2E:2F:F0:2E:F4:AF:23:0D:D3:53:60:AB"]}}]';
    }

    # iOS Universal Links — appID = TEAMID.bundleID.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        return 200 '{"applinks":{"apps":[],"details":[{"appID":"9J4X6PJX56.ru.begemot.whatgrows","paths":["/p/*","/quest/*","/plant/*","/invite/*","/i/*"]}]}}';
    }

    # Scan pages and covers of the library (rendered on demand, cached for a day).
    location ~ ^/library/[0-9a-f-]+/(cover\.jpg|p/[0-9]+/image\.jpg)$ {
        limit_req zone=botanik_scans burst=24 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8131;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8131;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
